name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions
      - run: deno lint --rules-exclude=no-import-prefix supabase/functions
      - run: deno check --node-modules-dir=none --frozen supabase/functions/ingest-news/index.ts
      - run: deno test --node-modules-dir=none --frozen supabase/functions

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: disposable-test-password
    steps:
      - uses: actions/checkout@v4
      - run: >
          psql -v ON_ERROR_STOP=1
          -f supabase/tests/editorial_roles.sql
          -f supabase/migrations/0001_foundation.sql
          -f supabase/migrations/0002_current_affairs.sql
          -f supabase/migrations/0003_news_ingestion.sql
          -f supabase/migrations/0007_news_editorial.sql
          -f supabase/tests/editorial.sql
          -f supabase/migrations/0008_practice_question_bank.sql
          -f supabase/tests/practice.sql
          -f supabase/migrations/0009_official_headlines.sql
          -f supabase/tests/official_headlines.sql
          -f supabase/migrations/0010_guest_practice.sql
          -f supabase/tests/guest_practice.sql
          -f supabase/migrations/0011_original_starter_practice.sql
